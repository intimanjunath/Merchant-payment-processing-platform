# The dashboard in Compose: the built files, plus the API under /api on the
# same origin (the prefix stripped, as the Vite dev server does), so the
# session cookie stays first-party and the API's Origin check sees the
# dashboard's own address.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Longer than a create whose provider call times out (PROVIDER_TIMEOUT_MS, 5 s by default).
    proxy_read_timeout 30s;
  }

  # Hashed build output never changes under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Page routes such as /payments/:id belong to the app; index.html is always fetched fresh.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }
}

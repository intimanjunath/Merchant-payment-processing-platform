name: payment-platform

# Keep the Node version in step with .nvmrc and the Dockerfile.
x-node-image: &node-image node:24.22.1-bookworm-slim

# API, worker and init share one image (Dockerfile target `app`); only the command differs.
x-app: &app
  build:
    context: .
    target: app
  env_file: .env

services:
  # Development database: PostgreSQL defaults, durable writes.
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  # Automated tests only. Durability is off for speed; data lives in memory
  # and disappears when the container stops. Never use these settings for
  # data worth keeping.
  test-db:
    image: postgres:18.6-bookworm
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${TEST_POSTGRES_DB:?copy .env.example to .env}
    ports:
      - '127.0.0.1:${TEST_DB_HOST_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot start-up job: migrations, the two development merchants and their
  # payments (development only). The payment seed is safe to run again; a second
  # run, after the worker has settled the captured payments, completes the refunds:
  # `docker compose run --rm init`.
  init:
    <<: *app
    command:
      - sh
      - -c
      - node packages/db/dist/cli/migrate.js && node packages/db/dist/cli/seed.js && node apps/api/dist/cli/seed-payments.js
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', 'apps/api/dist/main.js']
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ['node', 'apps/worker/dist/main.js']
    ports:
      - '127.0.0.1:${WORKER_HOST_PORT:-3001}:3001'
    # Longer than WORKER_SHUTDOWN_GRACE_MS, so a stop lets running jobs drain.
    stop_grace_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

  # The dashboard at http://localhost:5173 (ALLOWED_ORIGINS must name this address).
  web:
    build:
      context: .
      target: web
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-5173}:8080'
    depends_on:
      api:
        condition: service_healthy

  # Tools container for install, build, lint, migrations and tests, so the
  # host's Node version does not matter. Run with `docker compose run --rm dev <command>`.
  dev:
    image: *node-image
    profiles: ['tools']
    working_dir: /workspace
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      test-db:
        condition: service_healthy
    volumes:
      - .:/workspace
      - npm-cache:/root/.npm

volumes:
  db-data:
  npm-cache:
